<div>
    Determines the baseline that is used to compute the commits that are new in the current build.
    <ul>
        <li><strong>PREVIOUS</strong> - uses the latest commit of the previous build as baseline.</li>
        <li><strong>TARGET</strong> - uses the merge base of the current <code>HEAD</code> and the head of the
            target branch of a change request as baseline.</li>
    </ul>
</div>
